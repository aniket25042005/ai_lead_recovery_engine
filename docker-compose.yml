version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zizzet_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zizzet_recovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zizzet_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: zizzet_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/zizzet_recovery
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - .:/app

volumes:
  postgres_data:
